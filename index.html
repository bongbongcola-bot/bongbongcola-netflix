<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org data:; connect-src https://api.themoviedb.org; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>BONGBONGFLIX · 지금 극장에서 뭐 볼까?</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="logo" href="#top" aria-label="BONGBONGFLIX 홈">BONGBONGFLIX</a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="#row-now_playing">상영작</a>
      <a href="#row-popular">인기</a>
      <a href="#row-upcoming">개봉 예정</a>
      <a href="#row-mylist" id="nav-mylist" hidden>내 찜 목록</a>
    </nav>
    <div class="tools">
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">영화 검색</label>
        <input id="search-input" type="search" placeholder="영화 제목 검색" autocomplete="off" maxlength="60">
      </form>
      <button class="btn-icon" id="roulette-btn" type="button" title="오늘 뭐 볼까? 룰렛">🎲<span class="btn-icon__label"> 오늘 뭐 볼까?</span></button>
      <button class="btn-icon" id="mood-btn" type="button" aria-pressed="true" title="포스터 색을 배경에 반영">🎨<span class="sr-only">무드 테마</span></button>
    </div>
  </header>

  <main id="top">
    <div class="status" id="status" role="status" hidden></div>
    <section class="hero" id="hero" aria-label="추천 영화" hidden></section>

    <section class="search-results" id="search-results" aria-live="polite" hidden>
      <h2 id="search-title"></h2>
      <div class="grid" id="search-grid"></div>
      <button class="btn btn--ghost" id="search-more" type="button" hidden>더 보기</button>
    </section>

    <div id="rows"></div>
  </main>

  <footer class="footer">
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>BONGBONGFLIX는 TMDB 데이터를 쓰는 연습용 프로젝트이며 Netflix와 무관합니다.</p>
  </footer>

  <dialog class="modal" id="modal" aria-label="영화 상세"></dialog>
  <dialog class="modal modal--small" id="roulette" aria-label="오늘 뭐 볼까 룰렛"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
