name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 폴더 구성 (공개할 파일만 복사)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir dist
          cp -R index.html favicon.svg css js dist/
          node -e 'require("fs").writeFileSync("dist/config.js", "window.APP_CONFIG = Object.freeze(" + JSON.stringify({ TMDB_API_KEY: process.env.TMDB_API_KEY }) + ");\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
